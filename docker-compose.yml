# ── AESCSF v2 Evidence Tracker — on-prem stack ───────────────────────────────
#
# Authentication is handled by oauth2-proxy in auth_request mode.
#
# Request flow:
#   Browser → nginx (port 80) ─► auth_request ► oauth2-proxy (internal)
#                              │  (nginx injects X-Auth-Request-* from response)
#                              └► API / static files
#
# oauth2-proxy is NOT the reverse proxy — it only validates sessions.
# nginx is the sole internet-facing entry point.
#
# Watchtower update policy:
#   Only containers with label com.centurylinklabs.watchtower.enable=true are
#   ever updated automatically. nginx and api are local builds (no registry) so
#   Watchtower cannot touch them — they update only via deploy/update.sh.
#   oauth2-proxy is opted in: Watchtower pulls a new digest if quay.io releases
#   a security patch under the same v7.6.0 tag.
#   Set WATCHTOWER_MONITOR_ONLY=true in .env to receive notifications only,
#   with no automatic restarts.
#
# Usage:
#   1. cp .env.example .env  and fill in all values
#   2. docker compose up -d --build
#   3. Browse to http://<HOST_BIND>
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Nginx — sole internet-facing entry point ──────────────────────────────
  # Serves the static app, protects every route via auth_request to
  # oauth2-proxy, and proxies /api/* to the backend.
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      # Bind only to the internal NIC — never exposed on 0.0.0.0
      - "${HOST_BIND:-127.0.0.1}:${HOST_PORT:-80}:80"
    environment:
      AESCSF_STORAGE_MODE: "${AESCSF_STORAGE_MODE:-api}"
      AESCSF_TENANT_ID:    "${AESCSF_TENANT_ID}"
    depends_on:
      api:
        condition: service_healthy
      oauth2-proxy:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Local build — Watchtower cannot pull a registry image for this service.
    # Updates are applied by running deploy/update.sh.
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  # ── oauth2-proxy — internal auth validator only ───────────────────────────
  # Handles the Azure/Entra ID OAuth flow (/oauth2/*) and validates session
  # cookies for nginx's auth_request subrequests.
  # It is NOT the reverse proxy — UPSTREAMS is set to "static://200" so it
  # returns 202 Accepted once a user is authenticated (nginx ignores the body).
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    expose:
      - "4180"
    environment:
      # Entra ID provider
      OAUTH2_PROXY_PROVIDER:             "azure"
      OAUTH2_PROXY_AZURE_TENANT:         "${AESCSF_TENANT_ID}"
      OAUTH2_PROXY_CLIENT_ID:            "${AESCSF_CLIENT_ID}"
      OAUTH2_PROXY_CLIENT_SECRET:        "${AESCSF_CLIENT_SECRET}"
      OAUTH2_PROXY_OIDC_ISSUER_URL:      "${OAUTH2_PROXY_OIDC_ISSUER_URL}"
      OAUTH2_PROXY_REDIRECT_URL:         "${OAUTH2_PROXY_REDIRECT_URL}"

      # In auth_request mode oauth2-proxy doesn't proxy to an app upstream.
      # "static://200" returns a 200 OK body after authentication succeeds,
      # which nginx discards — only the X-Auth-Request-* headers matter.
      OAUTH2_PROXY_UPSTREAMS:            "static://200"

      # Session cookie — HTTP-only, never readable by browser JS
      OAUTH2_PROXY_COOKIE_SECRET:        "${OAUTH2_PROXY_COOKIE_SECRET}"
      OAUTH2_PROXY_COOKIE_SECURE:        "${OAUTH2_PROXY_COOKIE_SECURE:-false}"
      OAUTH2_PROXY_COOKIE_HTTPONLY:      "true"
      OAUTH2_PROXY_COOKIE_SAMESITE:      "lax"
      OAUTH2_PROXY_COOKIE_NAME:          "_aescsf_session"

      # Inject user identity as response headers on /oauth2/auth
      # nginx captures these via auth_request_set and injects them
      # as request headers to the API.
      OAUTH2_PROXY_SET_XAUTHREQUEST:     "true"
      OAUTH2_PROXY_PASS_ACCESS_TOKEN:    "true"
      # Azure/Entra ID work accounts store the email in preferred_username,
      # not the standard email claim.
      OAUTH2_PROXY_OIDC_EMAIL_CLAIM:     "preferred_username"

      # Restrict to your org's domain (e.g. yourcompany.com) or * for any
      OAUTH2_PROXY_EMAIL_DOMAINS:        "${OAUTH2_PROXY_EMAIL_DOMAINS:-*}"

      # Allow post-auth redirects to this host and the Azure logout endpoint.
      # Add your production domain to OAUTH2_PROXY_WHITELIST_DOMAINS in .env.
      OAUTH2_PROXY_WHITELIST_DOMAINS:    "${OAUTH2_PROXY_WHITELIST_DOMAINS:-localhost,login.microsoftonline.com}"

      # UX / network
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_HTTP_ADDRESS:         "0.0.0.0:4180"
      OAUTH2_PROXY_REVERSE_PROXY:        "true"
      OAUTH2_PROXY_SCOPE:                "openid email profile"

    restart: unless-stopped
    # /ping is oauth2-proxy's built-in unauthenticated health endpoint.
    # Without this, nginx's depends_on: service_healthy below has nothing to
    # wait on, and auth_request traffic could hit oauth2-proxy before it's
    # finished starting up (e.g. still fetching the OIDC discovery document).
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4180/ping"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Opted in to Watchtower: receives digest-level security patches when
    # quay.io republishes the v7.6.0 tag.  The tag itself is still pinned —
    # a version bump (v7.7.0+) requires a manual compose file edit.
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  # ── API — Express + SQLite, identity via proxy headers ────────────────────
  # Body size limits (three-tier):
  #   nginx:   client_max_body_size 25m  (outer gate — allows file uploads up to 25 MB)
  #   multer:  MAX_FILE_BYTES = 20 MB    (per-file limit enforced in server.js)
  #   express: json limit = 4 MB         (assessment JSON; much smaller than file uploads)
  api:
    build:
      context: server
      dockerfile: Dockerfile
    expose:
      - "3000"
    environment:
      AESCSF_SSO_ENABLED:          "true"
      AESCSF_ADMIN_OIDS:           "${AESCSF_ADMIN_OIDS}"
      AESCSF_AUDIT_RETENTION_DAYS: "${AESCSF_AUDIT_RETENTION_DAYS:-365}"
      AESCSF_AUTO_SNAPSHOT:        "${AESCSF_AUTO_SNAPSHOT:-monthly}"
      ALLOWED_ORIGIN:              "${ALLOWED_ORIGIN}"
      PORT:                        "3000"
      DATA_DIR:                    "/data"
    volumes:
      - aescsf_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # Local build — Watchtower cannot pull a registry image for this service.
    # Updates are applied by running deploy/update.sh.
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M

  # ── Watchtower — automated image update monitor ───────────────────────────
  # Only updates containers that opt in via the watchtower.enable=true label.
  # nginx and api are local builds that Watchtower cannot reach; they are
  # explicitly opted out above.  oauth2-proxy is the only container managed.
  #
  # Update schedule: Sundays at 03:00 UTC (cron: second minute hour dom month dow)
  # Set WATCHTOWER_MONITOR_ONLY=true in .env to receive notifications only,
  # without any automatic container restarts.
  watchtower:
    image: containrrr/watchtower:latest
    volumes:
      # Needs the Docker socket to inspect and restart containers
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Ignore all containers unless they carry watchtower.enable=true
      WATCHTOWER_LABEL_ENABLE: "true"

      # Check once a week — Sundays at 03:00 UTC
      # Format: second minute hour day-of-month month day-of-week
      WATCHTOWER_SCHEDULE: "0 0 3 * * 0"

      # Restart one container at a time so other services stay up
      WATCHTOWER_ROLLING_RESTART: "true"

      # Delete superseded images after update to prevent disk bloat
      WATCHTOWER_CLEANUP: "true"

      # Wait up to 60 s for a container's health check to pass after restart.
      # If the new image is unhealthy after this timeout Watchtower logs an
      # error but does NOT automatically roll back — check logs and run
      # deploy/update.sh to restore a known-good state if needed.
      WATCHTOWER_TIMEOUT: "60s"

      # Set to "true" to get notifications without any automatic restarts.
      # Useful for reviewing what would be updated before enabling live updates.
      WATCHTOWER_MONITOR_ONLY: "${WATCHTOWER_MONITOR_ONLY:-true}"

      # Optional notification URL in Shoutrrr format (leave blank to disable).
      # Examples:
      #   Microsoft Teams: teams://xxxxx@yyyyy/zzzzz
      #   Slack:           slack://xoxb-token@channel
      #   Email (SMTP):    smtp://user:pass@host:587/?from=a@b.com&to=c@d.com
      # Set WATCHTOWER_NOTIFICATION_URL in .env to enable.
      WATCHTOWER_NOTIFICATION_URL: "${WATCHTOWER_NOTIFICATION_URL:-}"

      WATCHTOWER_LOG_LEVEL: "info"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 64M

volumes:
  aescsf_data:
    driver: local
